
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container mt-5">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2>Student Management System</h2>
                <p class="text-muted">Manage your student records</p>
            </div>

        </div>

        <!-- Student Form -->
        <div class="card p-4 mb-4">

            <h5 id="formTitle">Add New Student</h5>

            <form id="studentForm">

                <input type="hidden" id="studentIndex">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="Studentname" class="form-control" placeholder="Enter full name" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="Enter email" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone</label>
                        <input type="tel" id="phone" class="form-control" placeholder="Enter phone number" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Course</label>

                        <select id="course" class="form-select" required>
                            <option value="">Select Course</option>
                            <option value="B.Tech CSE">B.Tech CSE</option>
                            <option value="BCA">BCA</option>
                            <option value="MCA">MCA</option>
                            <option value="BBA">BBA</option>
                            <option value="MBA">MBA</option>
                        </select>

                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Gender</label>

                        <select id="gender" class="form-select" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>

                    </div>

                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">
                    Add Student
                </button>

                <button type="reset" class="btn btn-secondary">
                    Clear
                </button>

            </form>

        </div>

        <!-- Search -->
        <div class="mb-3">
            <input type="text" id="search" class="form-control"
                placeholder="Search students by name...">
        </div>

        <!-- Student Table -->
        <div class="card p-3">

            <h5 class="mb-3">Student Records</h5>

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Course</th>
                            <th>Gender</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="studentTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <script src="main.js"></script>

</body>
</html>
